
- Global:
    Print    :  true

- Library:
    Name     :  DUMMY_PLUG
    Format   :  "nvc -L ./ --work=#{library_name} -a #{file_name}"
    Exclude  :  ["PipeWorkTest/Dummy_Plug/src/main/vhdl/core/sync_alt.vhd"]
    PathList :  ["PipeWorkTest/Dummy_Plug/src/main/vhdl/"]

- Library:
    Name     :  PIPEWORK
    Format   :  "nvc -L ./ --work=#{library_name} -a #{file_name}"
    Exclude  :  ["PipeWorkTest/PipeWork/src/components/sdpram_altera_auto_select.vhd",
                 "PipeWorkTest/PipeWork/src/components/sdpram_xilinx_auto_select.vhd",
                 "PipeWorkTest/PipeWork/src/components/sdpram_xilinx_ultrascale_auto_select.vhd"]
    PathList :  ["PipeWorkTest/PipeWork/src/"]

- Library:
    Name     :  WORK
    Format   :  "nvc -L ./ --work=#{library_name} -a #{file_name}"
    PathList :  ["PipeWorkTest/src/test/vhdl/axi4_master_to_stream/"]
    Top      :  ["AXI4_M2S_TB_32_32_256_SYNC",
                 "AXI4_M2S_TB_32_64_256_SYNC",
                 "AXI4_M2S_TB_64_32_256_SYNC",
                 "AXI4_M2S_TB_64_64_256_SYNC",
                 "AXI4_M2S_TB_32_32_256_100MHz_250MHz",
                 "AXI4_M2S_TB_32_32_256_250MHz_100MHz"]
