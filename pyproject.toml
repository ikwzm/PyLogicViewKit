[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pylogicviewkit"
version = "0.6.2"
description = "A programmable logic waveform viewer toolkit for Python."
readme = "Readme.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.0",
    "libfst>=0.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

